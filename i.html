<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Surprise</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6f2;
            font-family: 'Arial', sans-serif;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .flower-background {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .flower {
            position: absolute;
            font-size: 30px;
            color: pink;
            animation: float 5s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }

        .envelope {
            position: relative;
            width: 200px;
            height: 120px;
            background: url('https://i.imgur.com/ltXyHEK.png') no-repeat center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .letter {
            position: absolute;
            width: 180px;
            height: 100px;
            background: white;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateY(50px);
            opacity: 0;
            transition: all 0.5s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #ff4d88;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }

        .buttons {
            margin-top: 20px;
        }

        .btn {
            background: #ff4d88;
            border: none;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #e6005c;
        }

        .open .letter {
            transform: translate(-50%, -50%) translateY(-30px);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="flower-background">
        <div class="flower" style="top: 10%; left: 20%;">🌸</div>
        <div class="flower" style="top: 30%; left: 60%;">🌺</div>
        <div class="flower" style="top: 50%; left: 40%;">🌷</div>
        <div class="flower" style="top: 70%; left: 80%;">🌻</div>
        <div class="flower" style="top: 85%; left: 10%;">🌹</div>
    </div>
    <div class="envelope" id="envelope">
        <div class="letter" id="letter">Will you be my Valentine?</div>
    </div>
    <div class="buttons">
        <button class="btn" onclick="openLetter()">Open the letter</button>
        <button class="btn" onclick="closeLetter()">Close the letter</button>
    </div>

    <script>
        function openLetter() {
            document.getElementById('envelope').classList.add('open');
        }

        function closeLetter() {
            document.getElementById('envelope').classList.remove('open');
        }
    </script>
</body>
</html>
